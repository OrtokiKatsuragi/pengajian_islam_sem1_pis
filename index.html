<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Life Counter</title>
        <link rel="icon" type="image/x-icon" href="Life_Counter.ico">
        <link rel="stylesheet" href="nice.css">
    </head>
    <body>
        <div class="group">
            <div class="leftScreen">
                <h1 id="number">0</h1>
                <div class="buttonFrame">
                    <button id="plus1">+1</button>
                    <button id="minus1">-1</button>
                    <button id="solatJemaah">Solat Jemaah</button>
                </div>
                <button id="recordButton">Record</button>
                <button id="resetButton">Reset</button>
            </div>
            <div class="rightScreen">
                <h2>Records:</h2>
                <!-- <button id="resetRecordsButton">Reset Records</button> -->
                <h2 id="records"></h2>
            </div>
        </div>
    </body>
    <script src="nice.js"></script>
</html>
